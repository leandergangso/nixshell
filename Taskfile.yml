version: '3'

tasks:
  default:
    desc: Build
    cmds:
      - task: build

  build:
    desc: Build a static Linux binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -o nixshell .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  install:
    desc: Install to /usr/local/bin (override with PREFIX=/some/path)
    deps: [build]
    cmds:
      - sh -c 'install -Dm755 nixshell "${PREFIX:-/usr/local}/bin/nixshell"'

  clean:
    desc: Remove the built binary
    cmds:
      - rm -f nixshell
